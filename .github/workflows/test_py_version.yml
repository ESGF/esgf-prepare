name: test_py_version
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  uv-example:
    name: python
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: uv sync
        run: uv sync --python ${{ matrix.python-version }}

      - name: Activate cmip6 vocabulary database
        run: uv run --python ${{ matrix.python-version }} esgvoc use cmip6@latest

      - name: Activate cmip7 vocabulary database
        run: uv run --python ${{ matrix.python-version }} esgvoc use cmip7@latest

      - name: Activate cordex-cmip6 vocabulary database
        run: uv run --python ${{ matrix.python-version }} esgvoc use cordex-cmip6@latest

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest
